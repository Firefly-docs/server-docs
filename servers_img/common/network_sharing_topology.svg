mily="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#667085" font-weight="normal" text-anchor="middle">VLAN 4000 / VLAN 2101</text><text x="710" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#667085" font-weight="normal" text-anchor="middle">到 BMC 为 Trunk 上联</text><rect x="900" y="100" width="170" height="170" rx="10" fill="#eaf1ff" stroke="#5b8def" stroke-width="1.6"/><text x="985" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2328" font-weight="700" text-anchor="middle">BMC / aBMC</text><text x="985" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5b8def" font-weight="600" text-anchor="middle">VLAN 50：172.16.66.88</text><text x="985" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">nic0：192.168.100.100</text><text x="985" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5b8def" font-weight="700" text-anchor="middle">NAT + IP 转发</text><text x="985" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#667085" font-weight="normal" text-anchor="middle">集群统一出口</text><line x1="860" y1="160" x2="900" y2="160" stroke="#667085" stroke-width="2.2" marker-end="url(#arr-gray)"/><rect x="540" y="440" width="160" height="80" rx="10" fill="#e9f7ee" stroke="#4ca36a" stroke-width="1.6"/><text x="620" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle">子板 sub01</text><text x="620" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#667085" font-weight="normal" text-anchor="middle">eth0: 192.168.100.11</text><rect x="730" y="440" width="160" height="80" rx="10" fill="#e9f7ee" stroke="#4ca36a" stroke-width="1.6"/><text x="810" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle">子板 sub02</text><text x="810" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#667085" font-weight="normal" text-anchor="middle">eth0: 192.168.100.12</text><rect x="920" y="440" width="160" height="80" rx="10" fill="#e9f7ee" stroke="#4ca36a" stroke-width="1.6"/><text x="1000" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle">子板 sub03</text><text x="1000" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#667085" font-weight="normal" text-anchor="middle">eth0: 192.168.100.13</text><line x1="710" y1="220" x2="710" y2="360" stroke="#4ca36a" stroke-width="2.4"/><line x1="620" y1="360" x2="1000" y2="360" stroke="#4ca36a" stroke-width="2.4"/><line x1="620" y1="360" x2="620" y2="440" stroke="#4ca36a" stroke-width="2.4" marker-end="url(#arr-green)"/><line x1="810" y1="360" x2="810" y2="440" stroke="#4ca36a" stroke-width="2.4" marker-end="url(#arr-green)"/><line x1="1000" y1="360" x2="1000" y2="440" stroke="#4ca36a" stroke-width="2.4" marker-end="url(#arr-green)"/><text x="810" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#4ca36a" font-weight="600" text-anchor="middle">VLAN 1（Access）</text><text x="810" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#667085" font-weight="normal" text-anchor="middle">……（其余子板同理）</text><rect x="30" y="230" width="460" height="120" rx="10" fill="#fbfcfe" stroke="#c9cfd8" stroke-width="1.4"/><text x="50" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">对外表现</text><text x="50" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#667085" font-weight="normal" text-anchor="start">外部网络只看到 1 个地址：172.16.66.88</text><text x="50" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#667085" font-weight="normal" text-anchor="start">现场无需新增路由器，也无需为每块子板申请外网 IP</text><text x="50" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#667085" font-weight="normal" text-anchor="start">子板使用内部地址，经 BMC NAT 后共享上网</text><rect x="30" y="606" width="16" height="16" rx="4" fill="#eaf1ff" stroke="#5b8def" stroke-width="1.4"/><text x="54" y="620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#667085" font-weight="normal" text-anchor="start">VLAN 50 外部</text><rect x="220" y="606" width="16" height="16" rx="4" fill="#e9f7ee" stroke="#4ca36a" stroke-width="1.4"/><text x="244" y="620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#667085" font-weight="normal" text-anchor="start">VLAN 1 业务</text><rect x="410" y="606" width="16" height="16" rx="4" fill="#ffeadf" stroke="#d98b4a" stroke-width="1.4"/><text x="434" y="620" font-family="-apple-system,BlinkMacSystemFont,