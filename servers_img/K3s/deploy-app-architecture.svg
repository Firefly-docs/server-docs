<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1160 830" role="img" aria-label="K3s 部署应用架构图：三种访问入口与 hostPath 数据目录">
  <title>K3s 部署应用架构图：三种访问入口与 hostPath 数据目录</title>

  <!--
    文案与布局保持原样，仅替换视觉样式：
      卡片 #ffffff + 描边 #d1d5db、分组 #fafafa + 虚线描边 #e5e7eb（与站点代码块、提示块一致）
      正文文字 #0a0a0a，次要文字 #737373，命令文字 #374151
      连线与箭头统一为黑色 #000000
      字体取自站点字体栈：sans 与 mono
  -->
  <style>
    .text-sans { font-family: ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace; }
    .card         { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .group        { fill: #fafafa; stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 4 4; }
    .title        { fill: #0a0a0a; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .label        { fill: #737373; font-size: 12.5px; text-anchor: middle; }
    .cmd          { fill: #374151; font-size: 11.5px; text-anchor: middle; }
    .cluster-label { fill: #737373; font-size: 13px; font-weight: 600; }
    .edge         { stroke: #000000; stroke-width: 1.4px; fill: none; }
    .edge-label   { fill: #0a0a0a; font-size: 11.5px; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 图表外框 -->
  <rect x="0.5" y="0.5" width="1159" height="829" rx="12" class="card"/>

  <!-- 客户端（集群外） -->
  <rect class="card" x="450" y="24" width="260" height="60" rx="8"/>
  <text class="text-sans title" x="580" y="60">客户端（集群外）</text>

  <!-- K3s 集群 -->
  <rect class="group" x="20" y="120" width="1120" height="520" rx="10"/>
  <text class="text-sans cluster-label" x="44" y="150">K3s 集群</text>

  <!-- 入口一：节点端口 -->
  <rect class="card" x="40" y="168" width="340" height="172" rx="8"/>
  <text class="text-sans title" x="210" y="198">节点端口 30080</text>
  <text class="text-sans label" x="210" y="224">每台节点都监听</text>
  <text class="text-sans label" x="210" y="244">由 kube-proxy 转发</text>
  <text class="text-mono cmd" x="210" y="282">curl http://172.16.100.176:30080/</text>
  <text class="text-mono cmd" x="210" y="304">curl http://172.16.100.177:30080/</text>

  <!-- 入口二：Ingress -->
  <rect class="card" x="400" y="168" width="360" height="172" rx="8"/>
  <text class="text-sans title" x="580" y="198">Ingress 规则</text>
  <text class="text-sans label" x="580" y="224">Host: demo.local → demo-svc:80</text>
  <text class="text-sans label" x="580" y="244">由 Traefik 实现，每台节点 80 端口</text>
  <text class="text-mono cmd" x="580" y="282">curl -H 'Host: demo.local' http://172.16.100.176/</text>
  <text class="text-mono cmd" x="580" y="304">curl -H 'Host: demo.local' http://172.16.100.177/</text>

  <!-- 入口三：集群内部 -->
  <rect class="card" x="780" y="168" width="340" height="172" rx="8"/>
  <text class="text-sans title" x="950" y="198">集群内其它 Pod</text>
  <text class="text-sans label" x="950" y="224">通过 Service DNS 访问</text>
  <text class="text-sans label" x="950" y="244">不经过节点端口与 Ingress</text>
  <text class="text-mono cmd" x="950" y="282">wget -qO-</text>
  <text class="text-mono cmd" x="950" y="304">http://demo-svc.demo.svc.cluster.local/</text>

  <!-- 客户端到三个入口 -->
  <line class="edge" x1="580" y1="84" x2="210" y2="166" marker-end="url(#arrow)"/>
  <line class="edge" x1="580" y1="84" x2="580" y2="166" marker-end="url(#arrow)"/>
  <line class="edge" x1="580" y1="84" x2="950" y2="166" marker-end="url(#arrow)"/>

  <!-- 三个入口到 Service -->
  <path class="edge" d="M210,340 L210,386 L480,386 L480,418" marker-end="url(#arrow)"/>
  <line class="edge" x1="580" y1="340" x2="580" y2="418" marker-end="url(#arrow)"/>
  <path class="edge" d="M950,340 L950,386 L680,386 L680,418" marker-end="url(#arrow)"/>
  <text class="text-sans edge-label" x="330" y="380">kube-proxy 转发</text>
  <text class="text-sans edge-label" x="640" y="380">Traefik 按规则转发</text>
  <text class="text-sans edge-label" x="830" y="380">集群内直接调用</text>

  <!-- Service -->
  <rect class="card" x="360" y="420" width="440" height="72" rx="8"/>
  <text class="text-sans title" x="580" y="450">Service demo-svc</text>
  <text class="text-sans label" x="580" y="474">ClusterIP:80，Endpoints → Pod IP</text>

  <!-- Service 到 Pod -->
  <line class="edge" x1="580" y1="492" x2="580" y2="526" marker-end="url(#arrow)"/>
  <text class="text-sans edge-label" x="650" y="515">转发到容器 80 端口</text>

  <!-- Pod -->
  <rect class="card" x="300" y="528" width="560" height="72" rx="8"/>
  <text class="text-sans title" x="580" y="558">Pod（调度到 sub11）</text>
  <text class="text-sans label" x="580" y="582">nginx 容器，监听 80 端口</text>

  <!-- Pod 到宿主机目录 -->
  <path class="edge" d="M420,600 L420,706" marker-end="url(#arrow)"/>
  <path class="edge" d="M740,600 L740,706" marker-end="url(#arrow)"/>
  <text class="text-sans edge-label" x="420" y="654">挂载 /usr/share/nginx/html</text>
  <text class="text-sans edge-label" x="740" y="654">挂载 /etc/nginx/conf.d</text>

  <!-- sub11 宿主机目录 -->
  <rect class="group" x="100" y="664" width="960" height="144" rx="10"/>
  <text class="text-sans cluster-label" x="124" y="692">sub11 宿主机目录</text>

  <rect class="card" x="130" y="708" width="440" height="88" rx="8"/>
  <text class="text-mono cmd" x="350" y="740">/userdata/container/nginx_data/data_0</text>
  <text class="text-sans label" x="350" y="766">网页文件 → /usr/share/nginx/html</text>

  <rect class="card" x="590" y="708" width="440" height="88" rx="8"/>
  <text class="text-mono cmd" x="810" y="740">/userdata/container/nginx_data/config_0</text>
  <text class="text-sans label" x="810" y="766">Nginx 配置文件 → /etc/nginx/conf.d</text>
</svg>
